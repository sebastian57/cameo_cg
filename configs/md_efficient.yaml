# =============================================================================
# md_efficient.yaml — CG MD tuned for throughput, not for per-step fidelity.
#
# Purpose: many short replicas from diverse seeds instead of few long ones, at
# the lowest possible node-hour cost. Every setting below is justified by a
# measurement; see the notes on each block.
#
# Baseline being improved on (ala2 bb6, 8x3 ns, dt 2 fs, 1 replica/node):
#   43:05 wall for 1,500,000 steps = 1.72 ms/step on a SIX-BEAD system.
#   A GH200 evaluates that Allegro force in tens of microseconds, so >90% of
#   wall time was host dispatch, not physics.
# =============================================================================
md:
  # ---- model + start structure -------------------------------------------
  # Point these at the model under test. dataset_path supplies the start
  # frames referenced by frame_indices.
  training_config_path: REPLACE_ME_config.yaml
  params_path:          REPLACE_ME_params.pkl
  dataset_path: /e/project1/cameo/edelkoetter2/work/cameo_cg/local_work/input_data/ala2_cg_backbone_CB_aggforce.npz

  # ONE index -> every replica starts from the same structure and differs only
  # by velocity seed (replica_seed = seed + i -> jax.random.PRNGKey).
  # A list of exactly n_replicas entries instead gives multistart.
  # 189163 = the beta-basin 2D mode (phi -72.5, psi 152.5).
  frame_indices: [189163]

  # ---- integrator ---------------------------------------------------------
  integrator: nvt_langevin
  dt:     2.0        # fs. Fastest CG mode has a 22.2 fs period (lambda_max ~ 2302
                     # kcal/mol/A^2, m 12.011 amu) -> 11 steps/period. Do NOT raise
                     # to 4-5 fs: that drops to 5.5/4.4 steps per period.
  kT:     298.0      # K, matches the AA reference
  gamma:  5.0        # ps^-1 Langevin friction
  mass: [12.011, 14.007, 12.011, 12.011, 12.011, 14.007]
  zero_com_velocity: true
  equilibrate:   false
  n_equil_steps: 0

  # ---- REPLICAS: 64 PER GPU is the measured baseline --------------------
  # 64 x 4 GPUs = 256. This value is ONLY valid for the 6-bead alanine dipeptide
  # (ala2 bb6) and MUST be rescaled for any other system -- see the sizing note
  # at the bottom of this file before changing molecule.
  #
  # Measured 2026-08-25, ala2 bb6 v4 P0conv48k, 25,600,000 total steps, 4 GH200:
  #   R=5/GPU  (job 1491071)  2,315 replica-steps/s per GPU   9,259 aggregate
  #   R=64/GPU (job 1491197)  6,564 replica-steps/s per GPU  26,256 aggregate  975 s
  #   R=128/GPU(job 1491351)  6,882 replica-steps/s per GPU  27,527 aggregate  930 s
  # R=64 -> R=128 buys only 4.8% while HALVING per-replica trajectory length, so
  # 64 is the operating point: essentially all the throughput, longest replicas.
  # GPU memory is NOT the limit (2.1 GB at R=64, 3.1 GB at R=128, of ~96 GB).
  #
  # batched: true runs all n_replicas in ONE process on ONE GPU. vmap does not
  # span GPUs, so use 4 processes (one per GPU, pinned by CUDA_VISIBLE_DEVICES)
  # to fill a node -- see local_work/v4_51ns_256_batched.slurm.
  batched: true
  n_replicas: 64
  seed:       20260805
  n_steps:    1500000   # 3 ns. MUST be divisible by scan_chunk_size.

  # ---- (1) FUSED INTEGRATION — the main fix ------------------------------
  # scan_chunk_size defaults to 0, which selects a Python loop dispatching ONE
  # step at a time (md/runner.py:835) — 1.5M host round-trips for 3 ns. With
  # K > 0 the runner instead jits lax.scan over K steps (md/runner.py:752), so
  # the host dispatches n_steps/K times.
  # Memory is not a concern: the scan returns stacked (K, N, 3) arrays, i.e.
  # 72 bytes/step for 6 beads (5000 -> 0.36 MB).
  # Constraints: n_steps % scan_chunk_size == 0, and incompatible with
  # force_decomp (vjp inside scan is unsupported).
  scan_chunk_size: 5000

  # ---- (2) OUTPUT CADENCE -------------------------------------------------
  # Every recorded frame triggers an ON-DEVICE PE recompute (_nnu + _efn, two
  # dispatches) inside the chunk loop. At the old observables_every: 50 that is
  # 30,000 dispatch pairs per 3 ns, which becomes the bottleneck as soon as
  # scan removes the per-step loop. So the cadence must be relaxed WITH the
  # fusion, not independently of it.
  #
  # Justification for 1 ps: we measured ~950 beta<->alphaR transitions per
  # replica in 2.4 ns, i.e. one every ~2.5 ps. At the old 0.2 ps spacing every
  # population number carried ~12x redundancy. 1 ps still gives ~19,000
  # near-independent samples over 8 replicas x 3 ns — populations to <0.5%.
  # Do not exceed 2 ps: that starts aliasing the basin dynamics.
  output_every:      500    # 1 ps  (was 100 = 0.2 ps)
  observables_every: 500    # match output_every; no extra PE recomputes

  # ---- (3) STOP WRITING WHAT NOTHING READS -------------------------------
  # Audited 2026-08-25: all 16 analysis call sites read only ["R"]. Forces, PE,
  # KE, T and the observable arrays were written every run and never touched.
  # Keeping only 'step' leaves the frame index for bookkeeping.
  observables: [step]
  force_decomp: false       # also required by scan_chunk_size
  dump_for_ovito: false

  continuous_output: false  # set true + continuous_output_every for long runs
  continuous_output_every: 10   # so progress is observable; costs an IO flush

  # stability_abort takes a MAPPING of thresholds, not a bool (runner.py:81 calls
  # .get() on it). Omit the key entirely to disable, or set thresholds:
  stability_abort:
    min_pair_distance_A: 0.5
    max_force_kcal_per_mol_A: 1.0e6
    max_temperature_K: 2000.0

  output_dir:      local_work/md_runs/REPLACE_ME
  output_filename: traj_REPLACE_ME.npz

# =============================================================================
# (5) NOTE — XLA autotuning, not enabled here.
#
# The environment currently sets XLA_FLAGS=--xla_gpu_autotune_level=0, which
# disables kernel autotuning to keep compile time down. Compilation already
# costs 108.5 s per process, so that trade made sense for one-off runs.
#
# It is the wrong trade once a persistent compilation cache is in use: enable
#     export JAX_COMPILATION_CACHE_DIR=/e/project1/cameo/schmidt36/cameo_cg/local_work/jax_cache
# and drop the autotune_level=0, so the first run pays autotuning once and
# every later run reuses faster kernels for free. This matters most for the
# many-short-replicas strategy, where compile time can exceed MD time.
# Not enabled by default because it needs one measured run to confirm the
# cache actually hits across our module/driver stack.
#
# (6) SIZING n_replicas FOR A DIFFERENT MOLECULE — do not copy 64 blindly.
#
# 64/GPU saturates the GPU for a SIX-BEAD system. The batch exists to amortise
# kernel-launch overhead on a network far larger than the system; the larger the
# system, the fewer replicas are needed to reach the same occupancy, and the more
# memory each one costs.
#
# Measured memory on ala2 bb6: ~1 GB model/context baseline + ~16 MB per replica.
#
# To rescale: run a short throughput scan (e.g. R = 8, 32, 64, 128 for a few
# thousand steps) and take the knee — the point past which doubling R gains less
# than ~10%. As a first guess scale by beads: R ~ 64 * (6 / n_beads), then verify.
# Never assume; the vmap force-evaluation benchmark OVER-PREDICTS real MD wall
# clock by ~1.6x because it omits the neighbour-list update, integrator, COM
# removal and output stacking. Multiply benchmark rates by ~0.6.
#
# (4) vmap over replicas is implemented separately in md/runner_vmap.py — it
# replaces N processes (each with its own runtime, dispatch loop, ~900 threads
# and its own compile) with ONE process holding a batched state. Combined with
# scan the structure becomes scan-over-steps x vmap-over-replicas: a single
# dispatch advances every replica at once.
# =============================================================================
