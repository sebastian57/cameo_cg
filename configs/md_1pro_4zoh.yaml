# MD simulation config for 1pro_4zoh (Cα CG model, 53 beads)
#
# Units (units: physical, the default):
#   dt      — fs   (femtoseconds)
#   kT      — K    (Kelvin)
#   gamma   — ps   (Langevin friction timescale τ; γ = 1/τ internally)
#   mass    — amu  (unchanged)

md:
  units: physical               # physical (default) | akma

  # ---- Model overrides ----
  # override_use_priors: false  # set true for prior-residual models to add F_prior back at runtime

  # ---- Pointers ----
  training_config_path: local_work/outputs/1pro_4zoh_full/exports/1pro_4zoh_full_ml_only_config.yaml
  params_path:          local_work/outputs/1pro_4zoh_full/exports/1pro_4zoh_full_ml_only_params.pkl
  dataset_path:         data_prep/datasets/1pro_4zohB01_alltemp_cg_aggforce/combined_dataset.npz

  # ---- Initial conditions ----
  frame_idx: 0

  # ---- COM drift removal (zero yes equivalent) ----
  zero_com_velocity: true       # subtract mean momentum each step; prevents Langevin noise drift

  # ---- Equilibration (steps are not recorded) ----
  equilibrate:    false
  n_equil_steps:  1000          # steps to discard before production

  # ---- Integrator ----
  #   nve             — microcanonical (no thermostat); velocities drawn from Maxwell-Boltzmann at kT
  #   nvt_langevin    — Langevin thermostat; requires gamma (friction timescale)
  #   nvt_nose_hoover — Nosé-Hoover chain thermostat; requires tau (coupling timescale)
  integrator: nvt_langevin
  n_steps:    10000
  dt:         1.0               # fs
  kT:         300.0             # K  — sets target temperature; also used for velocity init in nve
  gamma:      50.0              # ps  (Langevin friction timescale τ = 1/γ; nvt_langevin only)
  # tau:      100.0             # ps  (Nosé-Hoover coupling timescale; nvt_nose_hoover only; default 100*dt)
  mass:       12.011            # amu — scalar (all beads) or list [m0, m1, ...] (one per species ID in order)

  # ---- Trajectory output (coordinates + forces) ----
  output_dir:      local_work/md_runs/1pro_4zoh
  output_filename: traj_nvt_10000steps.npz  # replicas append _rep00, _rep01, … automatically
  output_every:    50           # save full frames every N steps

  # ---- Multiple replicas ----
  # Run N independent simulations with different velocity initializations.
  # Seeds are derived as: seed + replica_index (0, 1, 2, ...).
  #
  # To run all replicas sequentially in one job:
  #   python scripts/run_md.py configs/md_1pro_4zoh.yaml
  #
  # To run replicas in parallel as a SLURM array (one GPU job per replica):
  #   sbatch --array=0-3 scripts/submit_md_array.sh configs/md_1pro_4zoh.yaml
  #   (or use submit_md_array.sh which reads n_replicas from the config automatically)
  #
  # Output files: traj_nvt_10000steps_rep00.npz, _rep01.npz, ...
  # With n_replicas: 1 (default), the original filename is used unchanged.
  n_replicas: 1
  seed: 42                      # base seed; replica i uses seed+i

  # ---- Continuous output (write partial trajectory while running) ----
  continuous_output: false      # write a .partial.npz that is updated during the run
  continuous_output_every: 10  # update partial file every N trajectory frames

  # ---- Scalar observables (written to CSV) ----
  observables_every: 10         # log scalars every N steps (can differ from output_every)
  observables:                  # quantities to include in the CSV
    - step
    - T
    - KE
    - PE
    - E_total
    - pressure
    - box_volume
  # observables_path: ~         # null = auto: <output_dir>/<stem>_observables.csv

  # ---- Visualization ----
  dump_for_ovito: true          # write a .dump file alongside the NPZ
  dump_padding:   20.0          # Å added to each box side
