# Canonical lookup registry for stable user-facing cameo_cg training settings.
# This file is intentionally annotated and not runnable until paths/model choices are edited.
# For a short first force-matching run, copy configs/example_training.yaml instead.

seed: 42
model_context: my_experiment
model_id: run_01

# Optional human metadata shown in runs/REGISTRY.md.
run:
  description: null  # short purpose or expected result
  tags: []           # searchable labels, e.g. [ala2, force-matching]

# -----------------------------------------------------------------------------
# Debug — all off by default.  Env vars (CHEMTRAIN_DEBUG_*) override if set.
# -----------------------------------------------------------------------------
debug:
  neighbor_logging: false        # log neighbor list stats on first batch
  neighbor_rank0_only: true      # restrict neighbor logs to rank 0
  shape_trace: false             # one-shot shape/edge trace at first forward pass
  model_logging: false           # jax.debug.print inside compiled model blocks

# -----------------------------------------------------------------------------
# Output paths. Launchers derive the four subdirectories from output_dir when
# only output_dir is supplied; set an explicit override only when needed.
# -----------------------------------------------------------------------------
paths:
  output_dir: ./local_work/outputs/my_run   # optional override; default launcher path is local_work/outputs/<date>_<config_name>
  export_dir: null                          # null = {output_dir}/exports
  checkpoint_dir: null                      # null = {output_dir}/checkpoints
  profile_dir: null                         # null = {output_dir}/profiles
  slurm_dir: null                           # null = {output_dir}/slurm

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  path: data_prep/datasets/example.npz       # REQUIRED — path to .npz dataset
  use_bucketed_dir: false                    # true = treat data.path as bucket directory (bucket_N*.npz)
  max_frames: null                            # null = use all frames
  crossfit:                                   # inactive unless a generated fold manifest is supplied
    enabled: false
    manifest_path: null
    held_out_fold: 0
  batch_mode: standard                        # standard = padded structures; tiled = packed structures
  # Tiled-mode options (only used when batch_mode: tiled)
  tile_target_beads: 1000
  tile_bucket_beads: null                     # null = auto; or list e.g. [1024, 2048]
  tile_target_edges: null                     # optional edge budget per tile
  tile_bucket_edges: null                     # optional positive edge-count buckets
  tile_edge_estimate_mode: valid_scaled       # valid_scaled | distance_cutoff
  tile_edge_estimate_cutoff: null             # required only for distance_cutoff estimates
  tile_edge_estimate_scale: 15.0
  tile_shuffle_structures: false
  tile_sort_by_size: true
  tile_sort_by_estimated_edges: false
  tile_isolate_large_structures: false
  tile_large_structure_threshold: null        # optional bead-count isolation threshold
  tile_large_structure_edge_threshold: null   # optional estimated-edge isolation threshold
  tile_spatial_separation: false
  tile_spatial_layout: line_x                  # line_x (legacy) | grid_3d (cell-list-friendly)
  tile_structure_gap: 25.0
  tile_rebuild_each_epoch: false
  tile_drop_incomplete: false
  tile_train_only: true
  # Static neighbor graphs (tiled mode only). Builds each tile's connectivity
  # once, per molecular segment, and reuses it instead of running a JAX-MD
  # neighbor update per sample. Rejects DSM / noised-residual / relative-entropy
  # / PBC configs, which evaluate the model away from the stored coordinates.
  # See DESIGN/STATIC_TILED_NEIGHBOR_LISTS.md.
  static_neighbors:
    enabled: false
    backend: kdtree                          # kdtree (fast) | chunked (reference oracle)
    block_size: 1024                         # chunked backend only; bounds temp memory at O(B^2)
    capacity_multiplier: 1.0                 # edge-capacity reserve over the measured maximum
    r_list: null                             # null = model.cutoff + model.dr_threshold

# -----------------------------------------------------------------------------
# Preprocessing
# -----------------------------------------------------------------------------
preprocessing:
  buffer_multiplier: 2.0       # box = max_range + 2 * buffer_multiplier * cutoff
  park_multiplier: 0.95        # parking location for padded atoms (fraction of box)

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  ml_model: allegro             # allegro | allegro_cueq | allegro_cueq_fast | mace | painn
  output_mode: energy           # energy | direct_force
  direct_force:                 # only supported by ML-only allegro_cueq_fast training
    head_hidden: 128
    head_layers: 2
    envelope_p: 6
    zero_init: true
    require_bidirectional_edges: true
  use_priors: true
  train_priors: false
  prior_only: false             # true = priors only (no ML backbone)
  cutoff: 10.0                  # neighbor list cutoff (Angstrom)
  dr_threshold: 0.5             # neighbor list rebuild threshold
  neighbor_list_format: dense   # dense | sparse
  neighbor_disable_cell_list: false
  pbc: false                    # true = periodic boundary conditions (requires 'box' key in NPZ)

  # Optional inference gates remain off unless their training artifacts and a
  # supported workflow have been prepared.
  robustness_gate:
    enabled: false
  local_extrapolation_gate:
    enabled: false

  # --- Edge-distance gate for allegro_cueq_fast ------------------------------
  edge_distance_gate:
    enabled: false              # true = gate directed edge energies by train-set type-pair distance support
    artifact_path: null         # .npz from data_prep/precompute_edge_distance_gate.py
    falloff_percent: 0.05       # relative width outside observed min/max before reaching floor
    floor: 0.0
    stop_gradient: true

  # --- Allegro hyperparameters -----------------------------------------------
  allegro:
    num_types: 22
    max_ell: 2                  # 1 | 2 | 3
    hidden_irreps: 64x0e + 64x0o + 64x1o + 64x1e + 64x2e    # only for cuEq backends
    num_layers: 3
    n_radial_basis: 18
    envelope_p: 6
    embed_n_hidden: [64, 128]
    species_embed: 32
    mlp_n_hidden: 96
    mlp_n_layers: 3
    mlp_activation: mish        # mish | silu | relu | gelu | elu | tanh
    mlp_hidden_activation: silu # overrides mlp_activation for hidden layers
    mlp_output_activation: tanh # linear | tanh | silu
    avg_num_neighbors: 15       # overridden at runtime from data
    max_edge_multiplier: 1.25
    neighbor_capacity_multiplier: 1.25  # JAX-MD sparse edge occupancy buffer
    neighbor_extra_capacity: 10  # extra neighbor buffer slots
    # max_edges: null           # explicit cap; null = inferred from test frame

  # --- cuEq-specific overrides (layered on top of allegro for cuEq models) ---
  allegro_cueq:
    mlp_dtype: float32          # float32 | bfloat16
    tp_backend: fused_sp        # fused_sp | blockwise | per_irrep
    tp_mode: mixed_naive
    tp_method: uniform_1d
    tp_batch_strategy: nested_vmap
    tp_left_mode: node_agg

  # --- MACE wrapper controls (inactive unless ml_model: mace) ----------------
  mace:
    max_edge_multiplier: 1.25
    neighbor_extra_capacity: 64

  # --- PaiNN wrapper controls (inactive unless ml_model: painn) --------------
  painn:
    max_edge_multiplier: 1.25
    neighbor_extra_capacity: 64

  # --- Prior energy parameters -----------------------------------------------
  priors:
    use_spline_priors: true
    spline_file: data_prep/datasets/fitted_priors_spline.npz
    residue_specific_angles: false
    min_repulsive_sep: 6           # sequence separation for repulsive pairs
    excluded_volume_min_sep: 2     # excluded volume pair min sequence separation
    excluded_volume_max_sep: 5     # excluded volume pair max sequence separation

    weights:
      bond: 0.5
      angle: 0.25
      dihedral: 0.25
      repulsive: 1.0
      excluded_volume: 0.0
      wca: 0.0
      fene: 0.0
      leash: 0.0
      dh: 0.0
      stickiness: 0.0
      salt_bridge: 0.0

    fene:
      enabled: false            # set weights.fene > 0 to activate
      r0: 3.8
      R0: 1.5
      k: 300.0
      wall_energy: 1.0e6
      eps: 1.0e-6

    leash:
      enabled: false            # set weights.leash > 0 to activate
      d_safe: auto              # auto = 1.5 * 99.9th percentile frame max distance
      k_safe: 0.2
      min_sep: 2

    aa_typing:
      source: dataset_map       # dataset_map
      his_charge: 0.0
      group_order: [POSITIVE, NEGATIVE, POLAR_UNCHARGED, NONPOLAR]
      stickiness_reference_group: POLAR_UNCHARGED

    dh:
      enabled: false
      mode: local_k
      K: 2
      k_DH: 1.0
      lambda_D: 8.0
      w_by_sep: [0.0, 1.0, 0.1]

    stickiness:
      enabled: false
      min_seq_sep: 3
      r0: 3.8
      sigma: 0.4
      s_free_init: [0.0, 0.0, 0.0]

    salt_bridge:
      enabled: false
      min_seq_sep: 3
      delta: -0.5
      r0: 3.8
      sigma: 0.3

    # Bond parameters (from Boltzmann inversion)
    r0: 3.8375
    kr: 154.5

    # Angle Fourier coefficients
    a: []
    b: []

    # Legacy harmonic angle (used if a/b are empty)
    theta0: 1.834
    k_theta: 8.27

    # Repulsive LJ-like
    epsilon: 1.0
    sigma: 3.0

    # Excluded volume (short-range, sequence separation 2-5)
    epsilon_ex: 1.0
    sigma_ex: 3.5

    # Dihedral
    k_dih: []
    gamma_dih: []

# -----------------------------------------------------------------------------
# Export
# -----------------------------------------------------------------------------
export:
  enabled: true                 # disable for direct-force teacher models
  mode: auto                    # auto | symbolic | fixed_size
  species_input_convention: model # model: connector passes zero-based species | lammps: MLIR subtracts one-based LAMMPS types
  also_export_naive: false      # for uniform_1d cueq: also emit <model>_symbolic.mlir via tp_method=naive

# -----------------------------------------------------------------------------
# Optimizer
# Only include the blocks actually referenced in training.stages.
# -----------------------------------------------------------------------------
optimizer:
  grad_clip: 2.0               # global gradient clipping

  adabelief:
    lr: 0.001
    peak_lr: 0.03
    end_lr: 0.001
    warmup_steps: 200
    decay_steps: 10000
    beta1: 0.95
    beta2: 0.999
    eps: 1.0e-8
    grad_clip: 5.0
    weight_decay: 0.0

  # --- Other supported optimizers (uncomment as needed) ---
  # adam:
  #   lr: 0.001
  #   peak_lr: 0.005
  #   end_lr: 0.001
  #   warmup_steps: 200
  #   decay_steps: 5000
  #   beta1: 0.9
  #   beta2: 0.999
  #   eps: 1.0e-8
  #   grad_clip: 5.0
  #   weight_decay: 0.0
  #
  # adamw:
  #   lr: 0.001
  #   peak_lr: 0.01
  #   end_lr: 0.001
  #   warmup_steps: 200
  #   decay_steps: 3000
  #   beta1: 0.95
  #   beta2: 0.995
  #   eps: 1.0e-8
  #   grad_clip: 5.0
  #   weight_decay: 0.0
  #
  # sgd_nesterov:
  #   lr: 0.01
  #   peak_lr: 0.01
  #   end_lr: 0.001
  #   warmup_steps: 100
  #   decay_steps: 5000
  #   momentum: 0.9
  #   grad_clip: 5.0
  #   weight_decay: 0.0
  #
  # lamb:
  #   lr: 0.01
  #   peak_lr: 0.01
  #   end_lr: 0.001
  #   warmup_steps: 200
  #   decay_steps: 3000
  #   beta1: 0.9
  #   beta2: 0.99
  #   eps: 1.0e-6
  #   grad_clip: 5.0
  #   weight_decay: 0.0
  #
  # yogi:
  #   lr: 0.001
  #   peak_lr: 0.001
  #   end_lr: 5.0e-5
  #   warmup_steps: 200
  #   decay_steps: 5000
  #   beta1: 0.9
  #   beta2: 0.999
  #   eps: 1.0e-6
  #   grad_clip: 4.0
  #   weight_decay: 5.0e-4
  #
  # lion:
  #   lr: 0.002
  #   peak_lr: 0.005
  #   end_lr: 0.0005
  #   warmup_steps: 200
  #   decay_steps: 5000
  #   beta1: 0.9
  #   beta2: 0.99

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  stages:
    - optimizer: adabelief
      epochs: 80

  val_fraction: 0.1
  batch_per_device: 4
  batch_cache: 10
  checkpoint_freq: 10           # save checkpoint every N epochs; 0 = only at end

  gammas:
    F: 1.0                      # force weight in loss
    U: 0.0                      # energy weight (usually 0 for force matching)

  force_loss_normalization: legacy_mean  # legacy_mean | valid_components | per_structure_components

  # Dataset fields below are required when teacher labels, HVP, DSM, or safety
  # regularization are enabled; the default raw force-matching path needs none.
  force_labels:
    mode: raw                   # raw | teacher | raw_teacher_blend
    teacher_key: TeacherForce
    raw_weight: 2.0
    teacher_weight: 1.0

  # --- Multi-checkpoint stochastic weight averaging ---
  swa:
    enabled: false
    stage: null                  # null = last nonzero training stage
    start_epoch: null            # null = ceil(stage_epochs * start_fraction)
    start_fraction: 0.75
    sample_freq_epochs: 1
    save_checkpoint: true
    use_best_params: false       # false = average live trainer.params

  # --- Micro-batch sharpness-aware minimization ---
  msam:
    enabled: false
    stage: null                  # null = last nonzero training stage
    start_epoch: null            # null = ceil(stage_epochs * start_fraction)
    start_fraction: 0.80
    rho: 0.01
    epsilon: 1.0e-12

  # --- Denoising score-matching auxiliary loss ---
  dsm:
    enabled: false
    lambda: 1.0
    sigma_min: 0.05
    sigma_max: 2.0
    kT: 0.636                  # kcal/mol at ~320 K
    seed_offset: 1729
    refresh_interval_steps: 0  # 0 = fixed DSM noise; >0 regenerates training DSM noise every N optimizer steps

  # --- Hessian-vector-product matching auxiliary loss ---
  hvp:
    enabled: false
    lambda: 0.01
    mode: projected_aa_term1
    target_key: HVP
    probe_key: hvp_probe
    loss_mask_key: hvp_loss_mask
    energy_template: auto
    require_targets: true
    stop_gradient_target: true

  # --- Optional safety-frame regularization for residual-prior training ---
  safety_regularization:
    enabled: false
    dataset_paths: []
    max_safety_fraction: 0.10
    normal_force_loss_on_safety: false
    seed_offset: 3119
    contact_attraction:
      enabled: true
      lambda: 0.05
      r_cut: 3.2
      pull_tolerance: 2.0
      max_pairs: 64
    force_cap:
      enabled: true
      lambda: 0.01
      mode: prior_relative
      alpha: 1.0
      offset: 10.0
      min_cap: 20.0

  # --- Precision ---
  enable_mixed_precision: false
  compute_dtype: float32        # float32 | bfloat16
  param_dtype: float32          # float32
  reduce_dtype: float32         # float32 | bfloat16

  # --- Memory optimization ---
  enable_buffer_donation: false
  donate_mode: state_only       # state_only | state_and_batch
  remat_level: 0                # 0 | 1 | 2
  remat_policy: none            # none | allegro_blocks_coarse | allegro_blocks_deep

  # --- Gradient accumulation ---
  grad_accum_steps: 1
  grad_accum_mode: stack_scan   # stack_scan

  # --- Prior pre-training ---
  pretrain_prior: false
  pretrain_prior_min_steps: 10
  pretrain_prior_max_steps: 200
  pretrain_prior_tol_grad: 1.0e-6

  # --- Residual-prior target mode ---
  prior_residual:
    enabled: false
    cache_enabled: true
    cache_path: null
    force_recompute: false
    compute_batch_size: 128

  # --- Relative-entropy fine-tuning (standalone, disabled by default) ---
  # Launch with scripts/run_relative_entropy.sh. Distances are Angstrom,
  # energies are kcal/mol, masses are amu, and time/friction use AKMA units.
  # Requires a compatible warm-start checkpoint configured by the launcher.
  relative_entropy:
    enabled: false
    reference_data_path: null   # null = use data.path; mapped-AA reference NPZ otherwise
    optimizer: adam
    sampler: md_langevin        # md_langevin | mc_mala
    iterations: 100
    reference_batch_size: 16
    n_replicas: 8
    steps_per_iteration: 200
    burn_in_steps: 50
    sample_stride: 10
    dt: 0.02045                 # AKMA time (~1 fs)
    kT: 0.636                   # kcal/mol
    gamma: 0.000977             # inverse AKMA time
    mass: 12.011                # amu; scalar or per-bead values
    start_frame_mode: reference_random  # configured alternatives require reviewed index maps
    persistent_chains: false
    initial_state_data_path: null
    initial_state_phi_targets_deg: []
    initial_state_phi_indices: []       # mapping-specific; four indices when enabled
    initial_state_phi_shift_deg: 180.0
    initial_state_cv_targets_deg: []
    initial_state_cv_indices: []        # mapping-specific four-index CV definitions
    initial_state_cv_shift_deg: []
    rollout_schedule: []         # MD only; stages start at iteration 0
    checkpoint_freq: 10
    max_force: 1.0e4             # kcal/mol/Angstrom
    min_pair_distance: 1.5       # Angstrom
    reject_on_instability: true
    seed_offset: 9117
    output_dir: null
    optimizer_gradient_scale: 1.0
    gradient_batch_size: 0       # 0 = unbatched parameter-gradient evaluation
    diagnostics_interval: 1
    trainable_param_substring: null
    chirality_diagnostics:
      enabled: false
      indices: []                # mapping-specific; review before enabling
      planar_threshold: 1.3
    barrier_penalty:
      enabled: false
      weight: 0.0
      v0: 1.3
      indices: []                # mapping-specific; review before enabling
    mc:
      mala:
        n_chains: 8
        steps_per_iteration: 200
        burn_in_steps: 50
        sample_stride: 10
        step_size: 1.0e-3

  # --- Noised-residual training (requires prior_residual.enabled=true) ---
  noised_residual_training:
    enabled: false
    seed_offset: 9999
    duplicate_every: ~  # null = every frame; int >= 2 = every Nth frame; e.g. 2 = every 2nd frame
    duplicate_offset: 0  # starting offset for the modulo; use to shift which frames are selected
    compute_batch_size: 100
    refresh_interval_epochs: 1  # regenerate noised structures and rebuild tiles every N epochs; 0 disables
    min_pair_distance: 2.5  # shrink per-frame noise until closest valid bead pair is at least this far; 0 disables
    max_rescale_attempts: 8
    rescale_factor: 0.5
    noise_levels: []  # list of numbers or dicts with sigma/name/attenuation/weight
    # Example (high-noise = zero residual, low-noise = attenuated residual):
    # noise_levels:
    #   - {sigma: 0.10, name: tiny_perturbation, attenuation: 0.5, weight: 2.0}
    #   - {sigma: 0.50, name: small_noise, attenuation: 0.1, weight: 2.0}
    #   - {sigma: 2.00, name: large_noise, attenuation: 0.0, weight: 2.0}

  # --- Export ---
  export_combined_ml_priors: false

  # --- Profiling ---
  profiling:
    enabled: false
    jax_trace_enabled: false
    trace_rank0_only: true
    log_compiles: false
    batch_profiler_enabled: false
    batch_profiler_warmup: 5
    batch_profiler_samples: 50
    batch_stats_enabled: false
    batch_stats_rank0_only: true
    batch_stats_log_every: 10
    loss_profile_enabled: false
    loss_profile_steps: 4
    epoch_summary_enabled: false

# -----------------------------------------------------------------------------
# Ensemble (optional)
# -----------------------------------------------------------------------------
ensemble:
  enabled: false
  n_models: 5
  base_seed: 42
  save_all_models: false
