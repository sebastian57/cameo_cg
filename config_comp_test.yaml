seed: 193749
debug_priors: false

#model_context: "phase1_r1_allegro_sgd_nesterov"
model_context: "comp_tests_allegro_adabelief"
protein_name: "4zohB01"
model_id: "comp_tests_sparse"

data:
  #path: "data_prep/datasets/2g4q4z5k_320K_kcalmol_1bead_notnorm_aggforce.npz"
  path: "data_prep/datasets/4zohB01_320K_kcalmol_1bead_notnorm_aggforce.npz"
  max_frames: 5000

preprocessing:
  buffer_multiplier: 2.0
  park_multiplier: 0.95

model:
  ml_model: "allegro"
  use_priors: true
  train_priors: false

# allegro_size: "normal"

  cutoff: 8.0
  dr_threshold: 0.2
  neighbor_list_format: "dense"  # Set to "sparse" to enable sparse neighbor lists

  allegro:
    num_types: 22
    max_ell: 2
    num_layers: 2
    n_radial_basis: 9
    envelope_p: 4
    embed_n_hidden: [32, 64]
    species_embed: 22
    mlp_n_hidden: 64
    mlp_n_layers: 2
      #mlp_activation: "silu"
    mlp_hidden_activation: "gelu" # was silu
    mlp_output_activation: "tanh"
    avg_num_neighbors: 15
    mlp_dtype: "float32"
    logging: false

  priors:
    use_spline_priors: true
    spline_file: "data_prep/datasets/fitted_priors_spline.npz"
    residue_specific_angles: false 
    weights:
      bond: 0.4
      angle: 0.4
      dihedral: 0.2
      repulsive: 1.0
      excluded_volume: 0.0 #1.0
      dh: 0.0
      stickiness: 0.0
      salt_bridge: 0.0
    aa_typing:
      source: "dataset_map"
      his_charge: 0.0
      group_order: ["POSITIVE", "NEGATIVE", "POLAR_UNCHARGED", "NONPOLAR"]
      stickiness_reference_group: "POLAR_UNCHARGED"
    dh:
      enabled: false
      mode: "local_k"
      K: 2
      k_DH: 1.0
      lambda_D: 8.0
      w_by_sep: [0.0, 1.0, 0.1]
    stickiness:
      enabled: false
      min_seq_sep: 3
      r0: 3.8
      sigma: 0.4
      s_free_init: [0.0, 0.0, 0.0]
    salt_bridge:
      enabled: false
      min_seq_sep: 3
      delta: -0.5
      r0: 3.8
      sigma: 0.3
    r0: 3.8375435
    kr: 154.50629422490843
    a: [-0.02086511, -0.36341857, -0.50767196, 0.09906029, 0.8319552, -0.00770968, -0.13320648, -1.14116021, 0.18145372, -0.55828783]
    b: [0.67521775, 0.14797897, -0.12157499, -0.8289584, 0.17162394, 0.48646108, 0.56000923, -0.13905056, -0.896762, -1.20144583]
    theta0: 1.8335507
    k_theta: 8.271271714604836
    epsilon: 5.0
    sigma: 3.0
    epsilon_ex: 6.0
    sigma_ex: 3.5
    k_dih: [0.47037187851535034, 0.9495107825945361]
    gamma_dih: [1.3759673785180062, 1.6211158177819938]

optimizer:
  grad_clip: 2.0

  sgd_nesterov:
    lr: 0.002
    peak_lr: 0.01
    end_lr: 0.0005
    warmup_steps: 200
    decay_steps: 5000
    momentum: 0.9
    grad_clip: 5.0
    weight_decay: 0.0

  adam:
    lr: 0.005
    peak_lr: 0.03
    end_lr: 0.001
    warmup_steps: 200
    decay_steps: 5000
    beta1: 0.9
    beta2: 0.99
    eps: 1.0e-8
    grad_clip: 5.0
    weight_decay: 0.0


  adabelief:
    lr: 5.0e-2
    peak_lr: 0.01
    end_lr: 5.0e-3
    warmup_steps: 500
    decay_steps: 5000
    beta1: 0.95
    beta2: 0.999
    eps: 1.0e-8
    grad_clip: 5.0
    weight_decay: 0.0

training:
  pretrain_prior: false
  pretrain_prior_min_steps: 10
  pretrain_prior_max_steps: 200
  pretrain_prior_tol_grad: 1.0e-6

  profiling:
    enabled: false
    jax_trace_enabled: false
    trace_dir: "./profiles_phase1_r1"
    trace_rank0_only: true
    log_compiles: false
    batch_profiler_enabled: false
    batch_profiler_warmup: 0
    batch_profiler_samples: 0

  stage1_optimizer: "adabelief"
  stage2_optimizer: "sgd_nesterov"

  epochs_adabelief: 3
  epochs_sgd_nesterov: 0

  val_fraction: 0.1
  batch_per_device: 32
  batch_cache: 10
  enable_mixed_precision: false
  compute_dtype: "float32"
  param_dtype: "float32"
  reduce_dtype: "float32"

  gammas:
    F: 1.0
    U: 0.0

  checkpoint_freq: 40
  checkpoint_path: "./checkpoints_phase1_r1"
  export_path: "./exported_models"
