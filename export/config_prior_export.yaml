# Minimal post-hoc export config for training_testing_large_model_lr
# Purpose: keep the trained ML weights untouched, but turn fixed safety priors
# back on for export / deployment.
#
# Active prior terms:
# - bond: spline prior from fitted_priors_spline.npz
# - angle: spline prior from fitted_priors_spline.npz
# - dihedral: spline prior from fitted_priors_spline.npz
# - repulsive: parametric nonbonded repulsion (weight 1.0)
#
# Explicitly inactive prior terms:
# - excluded_volume: weight 0.0
# - dh: enabled false, weight 0.0
# - stickiness: enabled false, weight 0.0
# - salt_bridge: enabled false, weight 0.0

model_id: training_testing_large_model_lr_with_priors

data:
  path: data_prep/datasets/2g4q4z5k_320K_kcalmol_1bead_notnorm_aggforce.npz

preprocessing:
  buffer_multiplier: 2.0
  park_multiplier: 0.95

model:
  ml_model: allegro_cueq_fast
  use_priors: true
  train_priors: false
  cutoff: 12.0
  dr_threshold: 0.2
  neighbor_list_format: dense
  allegro:
    num_types: 22
    max_ell: 3
    hidden_irreps: 64x0o + 64x1o + 64x1e + 64x2e
    num_layers: 3
    n_radial_basis: 18
    envelope_p: 6
    embed_n_hidden:
    - 64
    - 128
    species_embed: 32
    mlp_n_hidden: 64
    mlp_n_layers: 3
    mlp_hidden_activation: silu
    mlp_output_activation: tanh
    tp_backend: fused_sp
    tp_mode: mixed_naive
    tp_method: uniform_1d
    tp_method_by_layer:
    - uniform_1d
    - uniform_1d
    - uniform_1d
    tp_fused_option_b1_layer0: true
    tp_fused_option_b1_modes: auto
    tp_left_mode: node_agg
    tp_batch_strategy: nested_vmap
    avg_num_neighbors: 15
    mlp_dtype: float32
    logging: false
  priors:
    use_spline_priors: true
    spline_file: data_prep/datasets/fitted_priors_spline.npz
    residue_specific_angles: false
    weights:
      bond: 0.0
      angle: 0.0
      dihedral: 0.0
      repulsive: 1.0
      excluded_volume: 0.0
      dh: 0.0
      stickiness: 0.0
      salt_bridge: 0.0
    epsilon: 5.0
    sigma: 3.0
    epsilon_ex: 6.0
    sigma_ex: 3.5
    dh:
      enabled: false
      mode: local_k
      K: 2
      k_DH: 1.0
      lambda_D: 8.0
      w_by_sep:
      - 0.0
      - 1.0
      - 0.1
    stickiness:
      enabled: false
      min_seq_sep: 3
      r0: 3.8
      sigma: 0.4
      s_free_init:
      - 0.0
      - 0.0
      - 0.0
    salt_bridge:
      enabled: false
      min_seq_sep: 3
      delta: -0.5
      r0: 3.8
      sigma: 0.3

training:
  export_combined_ml_priors: true

optimizer:
  grad_clip: 10.0
