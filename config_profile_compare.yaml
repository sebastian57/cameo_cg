seed: 193749
debug_priors: false

model_context: "phase1_r1_allegro_sgd_nesterov"
protein_name: "2g4q4z5k"
model_id: "profile_compare"

data:
  path: "data_prep/datasets/2g4q4z5k_320K_kcalmol_1bead_notnorm_aggforce.npz"
  max_frames: 1024 #10000

preprocessing:
  buffer_multiplier: 2.0
  park_multiplier: 0.95

model:
  use_priors: false
  train_priors: false

  allegro_size: "normal"

  cutoff: 10.0
  dr_threshold: 1.0

  allegro:
    max_ell: 2
    num_layers: 2
    n_radial_basis: 9
    envelope_p: 4
    embed_n_hidden: [32, 64]
    species_embed: 8
    mlp_n_hidden: 64
    mlp_n_layers: 2
    mlp_activation: "mish"
    avg_num_neighbors: 9

  priors:
    use_spline_priors: false
    residue_specific_angles: true
    weights:
      bond: 0.0
      angle: 0.0
      dihedral: 0.0
      repulsive: 1.0
      excluded_volume: 1.0
    r0: 3.8375435
    kr: 154.50629422490843
    a: [-0.02086511, -0.36341857, -0.50767196, 0.09906029, 0.8319552, -0.00770968, -0.13320648, -1.14116021, 0.18145372, -0.55828783]
    b: [0.67521775, 0.14797897, -0.12157499, -0.8289584, 0.17162394, 0.48646108, 0.56000923, -0.13905056, -0.896762, -1.20144583]
    theta0: 1.8335507
    k_theta: 8.271271714604836
    epsilon: 5.0
    sigma: 3.0
    epsilon_ex: 6.0
    sigma_ex: 3.5
    k_dih: [0.47037187851535034, 0.9495107825945361]
    gamma_dih: [1.3759673785180062, 1.6211158177819938]

optimizer:
  grad_clip: 2.0

  sgd_nesterov:
    lr: 0.001
    peak_lr: 0.01
    end_lr: 0.0001
    warmup_steps: 200
    decay_steps: 5000
    momentum: 0.9
    grad_clip: 5.0
    weight_decay: 0.0

training:
  # Runtime precision / compilation policy
  enable_mixed_precision: true
  compute_dtype: "bfloat16"
  param_dtype: "float32"
  reduce_dtype: "bfloat16"

  # Keep donation explicit for profiling runs
  enable_buffer_donation: true
  donate_mode: "state_only"

  # Activation checkpointing / rematerialization
  remat_level: 0
  remat_policy: "none"

  pretrain_prior: false
  pretrain_prior_min_steps: 10
  pretrain_prior_max_steps: 200
  pretrain_prior_tol_grad: 1.0e-6

  profiling:
    enabled: true
    # Keep text-based timing profilers enabled, but disable JAX trace export to
    # avoid massive tensorflow.profiler.XSpace protobuf files (>2GB).
    jax_trace_enabled: false
    trace_dir: "./profiles_compare"
    # Restrict JAX trace collection to rank 0 to reduce trace volume.
    trace_rank0_only: true
    log_compiles: false
    # BatchProfiler settings for this baseline:
    # Warm up for 1 epoch, then sample 10 epochs.
    # With batch_per_device=24 on 8 GPUs, global batch=192 and we observe
    # ~5 update steps/epoch -> warmup 5 batches, sample 50 batches.
    batch_profiler_enabled: true
    batch_profiler_warmup: 5
    batch_profiler_samples: 50

  stage1_optimizer: "sgd_nesterov"
  stage2_optimizer: "yogi"

  # Profiling run: 1 warmup epoch + 10 measured epochs.
  epochs_sgd_nesterov: 11
  epochs_yogi: 0

  val_fraction: 0.0
  batch_per_device: 32
  batch_cache: 10

  gammas:
    F: 1.0
    U: 0.0

  # No checkpoints during profiling runs (avoids I/O skewing timing).
  checkpoint_freq: 0
  checkpoint_path: "./checkpoints_profile_compare"
  export_path: "./exported_models"
