# Isolation run 1 of 3: TEACHER BIAS ONLY.
#
# alpha halved to 0.5 after the 2026-08-03 finding that alpha=1.0 (teacher+TICA)
# stretched CA-bonds 3-5% and inflated |F| std to 44.7 vs the reference 19.8. Running
# the teacher alone attributes that distortion and tests whether 0.5 is geometrically safe.
#
# Diagnostic to check first: bond-length distributions vs the reference, NOT alphaL counts.
name: ala2_bb6_iso_teacher
mapping: ala2_backbone_cb_6
output_dir: /e/project1/cameo/schmidt36/cameo_cg/local_work/sampling_runs/ala2_bb6_iso_teacher
n_replicas: 12

# 12 conformationally diverse starting structures (farthest-point in phi/psi) --
# independent velocities alone leave every replica in the same basin.
structure:
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_00.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_01.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_02.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_03.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_04.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_05.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_06.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_07.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_08.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_09.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_10.gro
  - /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/start_frames_bb6/start_11.gro
topology: /e/project1/cameo/schmidt36/cameo_cg/local_work/aa_reference/ala2_constrained/topol.top
mdp:      /e/project1/cameo/schmidt36/cameo_cg/sampling/campaigns/production_298K_dt1fs.mdp

recompute_stride: 5
socket_dir: /tmp
ntomp: 8
print_stride: 100          # 0.1 ps at dt=1fs -- live CV monitoring
report_every: 500
monitor_cvs: [phi, psi, chirality]

biases:
  - type: mlcg_teacher
    training_config_path: /e/project1/cameo/schmidt36/cameo_cg/local_work/outputs/ala2_bb6_teacher_mid96_fm300/exports/ala2_bb6_teacher_mid96_fm300_mid96_fm300_t1024_bpd4_ga4_config.yaml
    params_path: /e/project1/cameo/schmidt36/cameo_cg/local_work/outputs/ala2_bb6_teacher_mid96_fm300/exports/ala2_bb6_teacher_mid96_fm300_mid96_fm300_t1024_bpd4_ga4_params.pkl
    dataset_path: /e/project1/cameo/schmidt36/cameo_cg/local_work/input_data/ala2_cg_backbone_cb_6bead_200k.npz
    alpha: 0.5
    equilibrate_steps: 10000    # 10 ps at 1 fs, alpha = 0
    ramp_steps: 10000           # 10 ps cosine ramp
    enabled: true
