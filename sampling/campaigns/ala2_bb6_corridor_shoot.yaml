# CORRIDOR SHOOTING -- entry statistics for the main<->alphaL channel.
#
# Why not a naive "entry" campaign: the reference contains only 47 frames in the
# phi 0..35 corridor and TWO in phi -25..25. There is nothing to seed from, which is
# exactly what makes it a barrier. Waiting for entries is hopeless: 25 beta->alphaL
# crossings in 500 ns is ~0.05 per ns, so 48 x 300 ps would yield ~0.7 events.
#
# Instead: seed ON the barrier, from the 24 alphaL-exit trajectories that each traverse
# the corridor at 0.05 ps resolution, then run UNBIASED with fresh velocities. Each
# replica commits either into alphaL (an entry) or back to beta/alphaR (a failed
# attempt). That is a committor-style shooting experiment and it samples the corridor
# per replica rather than per rare event.
#
# Note on interpretation: entries and exits BALANCE in the reference (25 vs 26 for
# beta<->alphaL, 3 vs 2 for alphaR<->alphaL), so the system is at equilibrium and by
# microscopic reversibility the entry corridor is the exit corridor reversed. The
# geometry is therefore already known from the exit run; what this adds is the FLUX
# weighting and the commitment statistics, plus an independent check of that symmetry.
name: ala2_bb6_corridor_shoot
mapping: ala2_backbone_cb_6
output_dir: /e/project1/cameo/schmidt36/cameo_cg/local_work/sampling_runs/ala2_bb6_corridor_shoot
n_replicas: 48

